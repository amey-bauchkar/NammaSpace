# Runs the contract audit and the Python and Node test suites on every push and pull request.
# Windows runner: Windows 11 is the platform the team develops and tests on (docs/INSTALL.md).
# No reconstruction, GPU work or browser automation runs here; the large LFS models are not downloaded.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Contracts + Python tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Contract examples and schema audit
        working-directory: architecture
        run: |
          python -I make_examples.py
          python -I contracts.py
      - name: Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider tests

  web:
    name: Node tests (viewer logic, search, path planner)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node tests
        shell: bash
        run: node --test web/tests/*.test.js
